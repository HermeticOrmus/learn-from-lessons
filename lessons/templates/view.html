<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lessons</title>
<style>
:root {
  --bg: #fbfbfa; --panel: #fbfbfa; --fg: #1b1b1a; --fg2: #3d3d3a; --muted: #6e6d68; --faint: #a3a29c;
  --hair: #e6e5e1; --hair2: #efeeeb; --sel: #f2f1ed; --accent: #3a56c4; --accent-soft: rgba(58, 86, 196, .09);
  --verified: #3f7d5c; --candidate: #b08a3e; --refuted: #b4584a;
  --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --serif: "Iowan Old Style", "Charter", "Source Serif Pro", Georgia, serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131312; --panel: #131312; --fg: #ebe9e4; --fg2: #cfcdc7; --muted: #9c9a94; --faint: #6c6b66;
    --hair: #2a2a28; --hair2: #20201e; --sel: #1d1d1b; --accent: #8fa6ef; --accent-soft: rgba(143, 166, 239, .12);
    --verified: #7fbf9a; --candidate: #d4b06a; --refuted: #e08d7f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131312; --panel: #131312; --fg: #ebe9e4; --fg2: #cfcdc7; --muted: #9c9a94; --faint: #6c6b66;
  --hair: #2a2a28; --hair2: #20201e; --sel: #1d1d1b; --accent: #8fa6ef; --accent-soft: rgba(143, 166, 239, .12);
  --verified: #7fbf9a; --candidate: #d4b06a; --refuted: #e08d7f; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
body { font: 14px/1.55 var(--sans); -webkit-font-smoothing: antialiased; font-feature-settings: "cv11", "ss01"; }
button { font: inherit; color: inherit; }
a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; text-underline-offset: 2px; }
code { font-family: var(--mono); font-size: .86em; background: var(--sel); padding: .05em .3em; border-radius: 3px; }
.num, .tab { font-variant-numeric: tabular-nums; }
.app { display: flex; flex-direction: column; height: 100vh; }
.top, .bar { flex: none; }

/* ---------- header */
.top { display: flex; align-items: center; gap: 28px; padding: 0 28px; height: 56px; border-bottom: 1px solid var(--hair); }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand b { font: 600 15px/1 var(--sans); letter-spacing: -.01em; }
.brand .sub { color: var(--faint); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tabs { display: flex; gap: 22px; height: 100%; }
.tabs button { all: unset; cursor: pointer; display: flex; align-items: center; color: var(--muted); font-size: 13.5px; border-bottom: 1.5px solid transparent; margin-bottom: -1px; }
.tabs button:hover { color: var(--fg); }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--fg); }
.top .theme { all: unset; cursor: pointer; margin-left: auto; color: var(--faint); font-size: 12.5px; }
.top .theme:hover { color: var(--fg); }

/* ---------- filter bar */
.bar { padding: 14px 28px 0; border-bottom: 1px solid var(--hair); }
.chips { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: baseline; }
.chips .cl { display: flex; flex-wrap: wrap; gap: 4px 2px; }
.chips .lab { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); margin-right: 10px; }
.chip { all: unset; cursor: pointer; padding: 3px 9px; border-radius: 999px; color: var(--muted); font-size: 13px; white-space: nowrap; }
.chip:hover { color: var(--fg); background: var(--sel); }
.chip .n { color: var(--faint); margin-left: 5px; font-size: 11.5px; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { color: var(--bg); background: var(--fg); }
.chip[aria-pressed="true"] .n { color: var(--bg); opacity: .6; }
.row2 { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; padding: 12px 0 12px; }
.search { flex: 0 1 260px; min-width: 180px; font: inherit; font-size: 13.5px; color: var(--fg); background: transparent; border: 0; border-bottom: 1px solid var(--hair); padding: 5px 0; outline: none; }
.search::placeholder { color: var(--faint); }
.search:focus { border-bottom-color: var(--fg); }
.sel { display: flex; align-items: baseline; gap: 6px; font-size: 13px; color: var(--faint); }
.sel select { field-sizing: content; max-width: 160px; text-overflow: ellipsis; font: inherit; color: var(--fg); background: transparent; border: 0; padding: 2px 0; cursor: pointer; outline: none; appearance: none; -webkit-appearance: none; }
.sel select:focus-visible { text-decoration: underline; }
.sel.on select { color: var(--accent); }
.selwrap { display: contents; }
.ftoggle { all: unset; cursor: pointer; font-size: 13px; color: var(--muted); display: none; }
.ftoggle b { color: var(--accent); font-weight: 500; }
.clear { all: unset; cursor: pointer; font-size: 13px; color: var(--accent); }
.abs { margin-left: auto; display: flex; align-items: center; gap: 14px; }
.seg { display: inline-flex; border: 1px solid var(--hair); border-radius: 7px; padding: 2px; }
.seg button { all: unset; cursor: pointer; padding: 3px 10px; font-size: 12.5px; color: var(--muted); border-radius: 5px; white-space: nowrap; }
.seg button:hover { color: var(--fg); }
.seg button[aria-pressed="true"] { background: var(--sel); color: var(--fg); }
.load { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.load b { color: var(--fg); font-weight: 500; font-variant-numeric: tabular-nums; }

/* ---------- body */
.body { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 520px); min-height: 0; }
main { min-height: 0; overflow: auto; position: relative; }
#detail { min-height: 0; overflow: auto; border-left: 1px solid var(--hair); padding: 30px 36px 60px; background: var(--panel); }
.view { padding: 8px 28px 60px; }
#v-graph { padding: 0; height: 100%; position: relative; }

/* ---------- tree */
.count { font-size: 12px; color: var(--faint); padding: 14px 0 6px; display: flex; justify-content: space-between; }
.grp { border-bottom: 1px solid var(--hair); }
.ph { all: unset; cursor: pointer; display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 0 10px; align-items: baseline; width: 100%; padding: 18px 0 4px; }
.ph .chev { color: var(--faint); font-size: 15px; line-height: 1; transition: transform .15s; display: inline-block; transform: rotate(90deg); width: 10px; text-align: center; }
.grp.closed .ph .chev { transform: none; }
.ph .pt { font: 500 17px/1.35 var(--serif); letter-spacing: -.005em; color: var(--fg); }
.ph .pt:hover { color: var(--accent); }
.ph .pc { font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; white-space: nowrap; }
.pmeta { padding: 0 0 12px 28px; }
.grp.closed .kids { display: none; }
.grp.closed .pmeta { padding-bottom: 16px; }
.kids { list-style: none; margin: 0 0 14px 28px; padding: 0; }
.kids .kids { margin: 0 0 0 22px; border-left: 1px solid var(--hair); padding-left: 0; }
.item { display: grid; grid-template-columns: 14px minmax(0, 1fr) 44px; gap: 0 10px; padding: 8px 8px 8px 10px; border-radius: 6px; cursor: pointer; margin-left: -10px; }
.kids .kids .item { margin-left: 0; padding-left: 12px; }
.item:hover { background: var(--sel); }
.item.active { background: var(--accent-soft); }
.item.active .t { color: var(--accent); }
.item.ctx { opacity: .42; }
.item .d { padding-top: 7px; }
.item .t { color: var(--fg); line-height: 1.45; }
.item.instance .t { font-size: 13px; color: var(--fg2); }
.item .seen { text-align: right; font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; padding-top: 2px; }
.m { display: flex; flex-wrap: wrap; align-items: center; gap: 0 12px; font-size: 12px; color: var(--faint); margin-top: 2px; }
.m .must { color: var(--accent); font-weight: 500; }
.m .should { color: var(--muted); }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
.dot.verified { background: var(--fg2); } .dot.candidate { background: transparent; box-shadow: inset 0 0 0 1.5px var(--candidate); } .dot.refuted { background: var(--refuted); opacity: .8; }
.flat .item { margin-left: 0; }
.empty { color: var(--muted); padding: 28px 0; }
.empty small { display: block; color: var(--faint); margin-top: 4px; }

/* ---------- graph */
canvas#cv { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
canvas#cv.drag { cursor: grabbing; } canvas#cv.hov { cursor: pointer; }
.gctl { position: absolute; top: 14px; left: 28px; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; font-size: 12.5px; color: var(--muted); }
.gctl label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
.gctl input { accent-color: var(--fg); margin: 0; }
.zoom { position: absolute; right: 18px; bottom: 18px; display: flex; flex-direction: column; border: 1px solid var(--hair); border-radius: 7px; background: var(--bg); }
.zoom button { all: unset; cursor: pointer; width: 28px; height: 26px; text-align: center; color: var(--muted); font-size: 14px; line-height: 26px; }
.zoom button + button { border-top: 1px solid var(--hair); }
.zoom button:hover { color: var(--fg); }
.legend { position: absolute; left: 28px; bottom: 16px; display: flex; flex-wrap: wrap; gap: 4px 14px; max-width: 70%; font-size: 11.5px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.legend .sep { width: 1px; height: 10px; background: var(--hair); }
.tip { position: absolute; pointer-events: none; max-width: 300px; padding: 7px 10px; background: var(--bg); border: 1px solid var(--hair); border-radius: 6px; font-size: 12.5px; line-height: 1.4; color: var(--fg); }
.tip small { display: block; color: var(--faint); font-size: 11px; margin-bottom: 2px; text-transform: uppercase; letter-spacing: .06em; }

/* ---------- overview */
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(116px, 1fr)); gap: 18px 24px; padding: 28px 0 26px; border-bottom: 1px solid var(--hair); }
.kpi b { display: block; font: 300 30px/1.1 var(--sans); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.kpi span { font-size: 12px; color: var(--muted); }
.h3 { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); font-weight: 500; margin: 28px 0 12px; }
.bars { display: grid; grid-template-columns: max-content minmax(60px, 1fr) 32px; gap: 7px 14px; align-items: center; font-size: 13px; max-width: 640px; }
.bars button { all: unset; cursor: pointer; color: var(--fg2); }
.bars button:hover { color: var(--accent); }
.bars .track { position: relative; height: 1px; background: var(--hair); }
.bars .fill { position: absolute; left: 0; top: -1px; height: 3px; border-radius: 2px; background: var(--fg); opacity: .75; }
.bars .n { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12.5px; }
.cols { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 0 32px; }
.cols ul { list-style: none; margin: 0; padding: 0; font-size: 13px; }
.cols li { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; border-bottom: 1px solid var(--hair2); color: var(--fg2); }
.cols li span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cols li .n { color: var(--muted); font-variant-numeric: tabular-nums; }
.mnote { font-size: 12.5px; color: var(--muted); margin: -4px 0 14px; }
svg.chart { max-width: 100%; height: auto; display: block; }
svg text { fill: var(--muted); font-size: 12px; font-family: var(--sans); }
svg text.num { fill: var(--fg); font-variant-numeric: tabular-nums; }
svg text.tick { fill: var(--faint); font-size: 10.5px; font-variant-numeric: tabular-nums; }
svg .hair { stroke: var(--hair); stroke-width: 1; }
svg .bar { stroke-width: 2.5; stroke-linecap: round; stroke: var(--fg); opacity: .7; }
svg .bar.k-correction { stroke: var(--accent); opacity: 1; }
svg .dot { fill: var(--fg); opacity: .55; }

/* ---------- detail */
.crumbs { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 6px; font-size: 12px; color: var(--faint); margin-bottom: 14px; }
.crumbs a { color: var(--muted); max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-block; vertical-align: bottom; }
.crumbs a:hover { color: var(--accent); text-decoration: none; }
.kicker { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin-bottom: 6px; display: flex; gap: 10px; }
.kicker .must { color: var(--accent); }
#detail h2 { font: 500 24px/1.3 var(--serif); letter-spacing: -.01em; margin: 0 0 12px; }
.facts { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12.5px; color: var(--muted); align-items: center; }
.facts .st { display: inline-flex; align-items: center; gap: 6px; color: var(--fg2); }
.scen { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0 0; }
.scen button { all: unset; cursor: pointer; font-size: 12px; color: var(--fg2); border: 1px solid var(--hair); border-radius: 999px; padding: 1px 9px; }
.scen button:hover { border-color: var(--fg); }
.sec { margin-top: 26px; }
.sec > .lab { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
.when { color: var(--fg2); margin: 0; }
dl.dwc { display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 10px 14px; margin: 0; padding-top: 14px; border-top: 1px solid var(--hair); }
dl.dwc dt { font-size: 12px; color: var(--faint); padding-top: 2px; }
dl.dwc dd { margin: 0; }
dl.dwc dd p, .rest p { margin: 0 0 8px; } dl.dwc dd p:last-child { margin: 0; }
dl.dwc dd.do { color: var(--fg); font-weight: 450; }
dl.dwc dd ul, .rest ul, .rest ol { margin: 0 0 8px; padding-left: 18px; }
.kidl { list-style: none; margin: 0; padding: 0; }
.kidl li { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 0 8px; padding: 6px 0; border-top: 1px solid var(--hair2); cursor: pointer; }
.kidl li:hover .t { color: var(--accent); }
.kidl .d { padding-top: 6px; }
.kidl .lv { font-size: 11px; color: var(--faint); }
.ev { list-style: none; margin: 0; padding: 0; }
.ev li { padding: 12px 0; border-top: 1px solid var(--hair2); }
.ev .em { display: flex; gap: 12px; font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
.ev .em b { font-weight: 500; color: var(--muted); }
.ev blockquote { margin: 5px 0 7px; font: 15px/1.5 var(--serif); color: var(--fg); white-space: pre-wrap; overflow-wrap: anywhere; }
.ref { display: flex; align-items: baseline; gap: 10px; font-size: 11.5px; }
.ref code, .ref a code { overflow-wrap: anywhere; color: var(--faint); background: none; padding: 0; font-size: 11px; }
.ref button { all: unset; cursor: pointer; color: var(--accent); white-space: nowrap; }
.path { font-size: 11.5px; color: var(--faint); margin-top: 30px; overflow-wrap: anywhere; }
.path a { color: var(--faint); }
.back { all: unset; cursor: pointer; color: var(--accent); font-size: 13px; margin-bottom: 18px; display: none; }
.intro h2 { font: 500 22px/1.3 var(--serif) !important; }
.intro p { color: var(--muted); margin: 0 0 14px; max-width: 46ch; }
.intro dl { display: grid; grid-template-columns: 92px 1fr; gap: 8px 12px; margin: 22px 0 0; font-size: 13px; padding-top: 16px; border-top: 1px solid var(--hair); }
.intro dt { color: var(--fg); } .intro dd { margin: 0; color: var(--muted); }
.intro dd b { color: var(--fg); font-weight: 500; font-variant-numeric: tabular-nums; }
.warn { margin: 30px 0 0; color: var(--muted); font-size: 12px; }
.warn summary { cursor: pointer; color: var(--faint); }
.warn ul { padding-left: 18px; }

/* ---------- small screens */
@media (max-width: 1100px) { .body { grid-template-columns: minmax(0, 1fr) minmax(0, 420px); } #detail { padding: 26px 26px 60px; } }
@media (max-width: 860px) {
  .app { display: block; height: auto; }
  .top { height: auto; flex-wrap: wrap; gap: 6px 20px; padding: 14px 16px 0; }
  .brand { width: 100%; justify-content: space-between; }
  .brand .sub { display: none; }
  .tabs { height: 38px; }
  .top .theme { position: absolute; right: 16px; top: 14px; }
  .bar { padding: 12px 16px 0; }
  .chips { display: flex; overflow-x: auto; margin: 0 -16px; padding: 0 16px 2px; scrollbar-width: none; }
  .chips .cl { flex-wrap: nowrap; margin-left: 0; }
  .chips::-webkit-scrollbar { display: none; }
  .row2 { gap: 10px 16px; }
  .search { flex: 1 1 0; min-width: 0; }
  .ftoggle { display: inline-block; }
  .selwrap { display: none; }
  .selwrap.open { display: flex; flex-wrap: wrap; gap: 8px 18px; width: 100%; }
  .abs { margin-left: 0; width: 100%; flex-wrap: wrap; gap: 8px 14px; }
  .ph { grid-template-columns: 18px minmax(0, 1fr); }
  .ph .pc { grid-column: 2; margin-top: 2px; }
  .body { display: block; }
  main { overflow: visible; }
  .view { padding: 4px 16px 48px; }
  #v-graph { height: 72vh; }
  .gctl { left: 16px; } .legend { left: 16px; max-width: 80%; }
  #detail { display: none; position: fixed; inset: 0; z-index: 10; border: 0; padding: 18px 18px 60px; }
  #detail.open { display: block; }
  .back { display: inline-block; }
  .ph .pt { font-size: 16px; }
  .kids { margin-left: 18px; }
  .kids .kids { margin-left: 10px; }
  .pmeta { padding-left: 28px; }
}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="brand"><b>Lessons</b><span class="sub" id="sub"></span></div>
  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-view="library">Library</button>
    <button role="tab" data-view="graph">Graph</button>
    <button role="tab" data-view="overview">Overview</button>
  </nav>
  <button class="theme" id="theme" title="Colour theme"></button>
</header>
<section class="bar" id="bar">
  <div class="chips" id="chips"><span class="lab">Scenario</span><div class="cl" id="cl"></div></div>
  <div class="row2" id="row2">
    <input type="search" class="search" id="q" placeholder="Search lessons and quotes" aria-label="Search lessons">
    <div class="abs">
      <div class="seg" id="seg" role="group" aria-label="Abstraction">
        <button data-a="0">Principles</button><button data-a="1">+ Rules</button><button data-a="2">+ Instances</button>
      </div>
      <span class="load" id="load"></span>
    </div>
  </div>
</section>
<div class="body">
  <main id="main">
    <section class="view" id="v-library"><div class="count" id="count"></div><div id="tree"></div>
      <details class="warn" id="warn" hidden><summary></summary><ul></ul></details></section>
    <section id="v-graph" hidden>
      <canvas id="cv" aria-label="Lesson graph"></canvas>
      <div class="gctl">
        <span class="seg" id="colorby"><button data-c="status">Status</button><button data-c="scenario">Scenario</button></span>
        <label><input type="checkbox" id="rel" checked> Related links</label>
      </div>
      <div class="legend" id="legend"></div>
      <div class="zoom"><button id="zin" title="Zoom in">+</button><button id="zout" title="Zoom out">&minus;</button><button id="zfit" title="Fit">&#9675;</button></div>
      <div class="tip" id="tip" hidden></div>
    </section>
    <section class="view" id="v-overview" hidden>
      <div class="kpis" id="kpis"></div>
      <div id="ovlists"></div>
      <div id="moments" hidden>
        <div class="h3">Moments per week</div>
        <p class="mnote" id="mnote"></p>
        {{CHART}}
      </div>
    </section>
  </main>
  <aside id="detail" aria-live="polite"></aside>
</div>
</div>
<script type="application/json" id="data">{{DATA}}</script>
<script>
(function () {
  "use strict";
  var D = JSON.parse(document.getElementById("data").textContent);
  var L = D.lessons, BY = {};
  L.forEach(function (l) { BY[l.id] = l; });
  var LEVELS = ["principle", "rule", "instance"];
  var SELECTS = [["level", "Level"], ["strength", "Strength"], ["status", "Status"], ["scope", "Scope"], ["source", "Source"]];
  var state = { q: "", scenario: "", level: "", strength: "", status: "", scope: "", source: "", abs: 2 };
  var view = "library", current = null, closed = {};

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = String(text);
    return e;
  }
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
  function plural(n, w) { return n + " " + w + (n === 1 ? "" : (/s$/.test(w) ? "es" : "s")); }
  function lvl(l) { var i = LEVELS.indexOf(l.level); return i < 0 ? 1 : i; }

  // ---------------------------------------------------------------- filtering
  function value(l, f) {
    return { level: [l.level], strength: [l.strength], status: [l.status], scope: [l.scope_label], source: l.sources }[f];
  }
  function haystack(l) {
    if (!l._h) {

  function graphFilter(s) { G.match = s; requestDraw(); }
  function legend() {

  function toWorld(ev) { var r = cv.getBoundingClientRect(); return [(ev.clientX - r.left - G.tx) / G.k, (ev.clientY - r.top - G.ty) / G.k, ev.clientX - r.left, ev.clientY - r.top]; }

  }
  var drag = null;

  function zoomAt(f, sx, sy) {

  }

  document.getElementById("zout").addEventListener("click", function () { zoomAt(1 / 1.35, G.w / 2, G.h / 2); });

  function showGraph() {

  }

  // ---------------------------------------------------------------- overview

  }

  // ---------------------------------------------------------------- detail
  var detail = document.getElementById("detail");

    function fallback() {
      var ta = el("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); done(); } catch (e) { btn.textContent = "select & copy"; }
      document.body.removeChild(ta);

    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, fallback);
    else fallback();
  }
  function lessonLink(id, cls) { var a = el("a", cls, BY[id].title); a.href = "#" + view + "/" + encodeURIComponent(id); return a; }

  }
